[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gnu-apmg"
version = "0.2.0a1"
description = "Inventaire photographique local et documentaire, lecture seule"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
keywords = ["photography", "metadata", "exif", "sqlite", "local-first"]
dependencies = []

[project.optional-dependencies]
preparation = ["Pillow==13.0.0", "pillow-heif==1.8.1", "jsonschema==4.26.0"]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
taxonomy-validation = ["rdflib==7.6.0"]

[project.scripts]
gnu-apmg = "photosemantique.cli:main"
photosemantique = "photosemantique.cli:main"

[tool.setuptools.packages.find]
include = ["photosemantique*"]

[tool.setuptools.package-data]
photosemantique = ["migrations/*.sql", "schemas/*.json", "taxonomies/*.json", "templates/*.html"]
