<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 590" role="img" aria-label="Sortie réelle simplifiée d’un test local sur trois fichiers fictifs">
<rect width="1300" height="590" rx="22" fill="#0e1628"/>
<rect x="0" y="0" width="1300" height="72" rx="22" fill="#202d42"/>
<circle cx="36" cy="37" r="9" fill="#ec6973"/><circle cx="66" cy="37" r="9" fill="#f3bf4e"/><circle cx="96" cy="37" r="9" fill="#5fca92"/>
<text x="150" y="46" font-family="Arial, sans-serif" font-size="24" fill="#edf3fc">GNU APMG · sortie du pilote synthétique (illustration)</text>
<text x="44" y="112" font-family="Consolas, Menlo, monospace" font-size="20" fill="#7ee0b7">$ python -m photosemantique scan PhotosPilote --db etat/inventaire.sqlite --no-exif</text>
<text x="44" y="141" font-family="Consolas, Menlo, monospace" font-size="20" fill="#dae3ef">{</text>
<text x="44" y="170" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "discovered": 3,</text>
<text x="44" y="199" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "indexed": 3,</text>
<text x="44" y="228" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "errors": 0,</text>
<text x="44" y="257" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "status": "completed",</text>
<text x="44" y="286" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "exif_mode": "skipped_explicitly"</text>
<text x="44" y="315" font-family="Consolas, Menlo, monospace" font-size="20" fill="#dae3ef">}</text>
<text x="44" y="344" font-family="Consolas, Menlo, monospace" font-size="20" fill="#7ee0b7">$ python -m photosemantique report --db etat/inventaire.sqlite</text>
<text x="44" y="373" font-family="Consolas, Menlo, monospace" font-size="20" fill="#dae3ef">{</text>
<text x="44" y="402" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "unique_assets": 2,</text>
<text x="44" y="431" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "known_paths": 3,</text>
<text x="44" y="460" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "exact_duplicate_groups": 1,</text>
<text x="44" y="489" font-family="Consolas, Menlo, monospace" font-size="20" fill="#e0bc83">  "scans": 1</text>
<text x="44" y="518" font-family="Consolas, Menlo, monospace" font-size="20" fill="#dae3ef">}</text>
<text x="44" y="564" font-family="Arial, sans-serif" font-size="17" fill="#9eb0c9">Sortie fondée sur le test réel · chemins raccourcis · --no-exif signifie que les métadonnées ne sont pas extraites.</text></svg>